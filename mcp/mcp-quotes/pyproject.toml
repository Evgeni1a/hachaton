[project]
name = "mcp-quotes"
version = "1.0.0"
description = "MCP server for AI quote generation via Ollama"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "mcp>=1.26.0,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_quotes*"]
